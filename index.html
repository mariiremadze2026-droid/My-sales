<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>მარკეტი - Temu სტილი</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .animated-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #4facfe 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      z-index: -2;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .page { display: none; }
    .page.active { display: block; }
    .product-card:hover { transform: translateY(-12px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
    .nav-btn.active { background-color: #7c3aed; color: white; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <div class="animated-bg"></div>

  <!-- Navigation Tabs -->
  <div class="fixed top-0 left-0 right-0 bg-white/90 backdrop-blur-md shadow z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex gap-2 overflow-x-auto">
      <button onclick="showPage('main')" class="nav-btn active px-5 py-2 rounded-xl text-sm font-medium">🏠 მთავარი</button>
      <button onclick="showPage('register')" class="nav-btn px-5 py-2 rounded-xl text-sm font-medium">📝 რეგისტრაცია</button>
      <button onclick="showPage('admin')" class="nav-btn px-5 py-2 rounded-xl text-sm font-medium">⚙️ ადმინ</button>
      <button onclick="showPage('add')" class="nav-btn px-5 py-2 rounded-xl text-sm font-medium">➕ პროდუქტის დამატება</button>
    </div>
  </div>

  <!-- MAIN PAGE -->
  <div id="main" class="page active pt-20 pb-10">
    <div class="max-w-7xl mx-auto px-6">
      <h1 class="text-4xl font-bold text-white text-center mb-6">🌟 მარკეტი</h1>
      <h2 class="text-5xl font-bold text-center text-white mb-4">დაბალი ფასები • ყველასთვის</h2>
      
      <div class="max-w-xl mx-auto mb-10">
        <div class="bg-white rounded-2xl shadow p-4 flex items-center">
          <i class="fas fa-search text-gray-400 mx-3"></i>
          <input type="text" placeholder="რა გინდა იპოვო?" class="flex-1 outline-none">
        </div>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6" id="products"></div>
    </div>
  </div>

  <!-- REGISTER PAGE -->
  <div id="register" class="page pt-20">
    <div class="max-w-md mx-auto bg-white rounded-3xl shadow-2xl p-8">
      <h2 class="text-3xl font-bold text-center text-purple-600 mb-2">გახდი გამყიდველი</h2>
      <p class="text-center text-gray-500 mb-8">დაიწყე გაყიდვა დღესვე</p>
      
      <input type="text" placeholder="სრული სახელი" class="w-full px-5 py-4 rounded-2xl border mb-4">
      <input type="email" placeholder="ელ. ფოსტა" class="w-full px-5 py-4 rounded-2xl border mb-4">
      <input type="tel" placeholder="ტელეფონი (+995)" class="w-full px-5 py-4 rounded-2xl border mb-4">
      <input type="password" placeholder="პაროლი" class="w-full px-5 py-4 rounded-2xl border mb-6">
      
      <button onclick="alert('რეგისტრაცია წარმატებულია! 🎉')" 
              class="w-full bg-purple-600 text-white py-4 rounded-2xl text-lg font-semibold">
        რეგისტრაცია
      </button>
    </div>
  </div>

  <!-- ADMIN PAGE -->
  <div id="admin" class="page pt-20">
    <div class="max-w-4xl mx-auto px-6">
      <h2 class="text-4xl font-bold text-white mb-8">ადმინ პანელი</h2>
      <div class="bg-white rounded-3xl p-8 shadow-xl">
        <p class="text-2xl mb-6">მოგესალმებით, ადმინისტრატორო!</p>
        <button onclick="showPage('add')" 
                class="bg-purple-600 text-white px-8 py-4 rounded-2xl text-lg font-semibold">
          + ახალი პროდუქტის დამატება
        </button>
      </div>
    </div>
  </div>

  <!-- ADD PRODUCT PAGE -->
  <div id="add" class="page pt-20">
    <div class="max-w-2xl mx-auto px-6">
      <div class="bg-white rounded-3xl shadow-xl p-8">
        <h2 class="text-3xl font-bold text-center mb-8 text-purple-700">ახალი პროდუქტის დამატება</h2>

        <input type="text" id="prodName" placeholder="პროდუქტის სახელი *" class="w-full px-5 py-4 rounded-2xl border mb-5">

        <textarea id="prodDesc" placeholder="აღწერა" rows="4" class="w-full px-5 py-4 rounded-2xl border mb-5"></textarea>

        <div class="grid grid-cols-2 gap-4 mb-8">
          <input type="number" id="prodPrice" placeholder="ფასი (ლ)" class="px-5 py-4 rounded-2xl border">
          <input type="number" id="prodOldPrice" placeholder="ძველი ფასი (ლ)" class="px-5 py-4 rounded-2xl border">
        </div>

        <div class="mb-8">
          <label class="block text-lg font-medium mb-3">📸 ფოტოები (კამერით)</label>
          <input type="file" id="prodImages" multiple accept="image/*" capture="environment" class="hidden" onchange="previewImages(event)">
          <button onclick="document.getElementById('prodImages').click()" 
                  class="w-full border-2 border-dashed border-purple-400 py-12 rounded-3xl text-purple-600 hover:border-purple-600">
            📷 დააჭირე ფოტოების გადასაღებად
          </button>
          <div id="preview" class="flex flex-wrap gap-3 mt-4"></div>
        </div>

        <button onclick="submitProduct()" 
                class="w-full bg-purple-600 text-white py-5 rounded-2xl text-xl font-semibold">
          გამოქვეყნება
        </button>
      </div>
    </div>
  </div>

  <script>
    // Page Navigation
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      event.currentTarget.classList.add('active');
    }

    // Products on Main Page
    const products = [
      {name: "სპორტული კოსტუმი", price: "89 ლ", old: "129 ლ"},
      {name: "უსადენო ყურსასმენები", price: "45 ლ", old: "79 ლ"},
      {name: "ქალის ჩანთა", price: "65 ლ", old: "95 ლ"},
      {name: "ტელეფონის ქეისი", price: "18 ლ", old: "28 ლ"},
      {name: "სამზარეულოს ნაკრები", price: "115 ლ", old: "169 ლ"}
    ];

    function renderProducts() {
      const container = document.getElementById('products');
      container.innerHTML = products.map(p => `
        <div class="product-card bg-white rounded-3xl overflow-hidden shadow-lg">
          <div class="h-52 bg-gradient-to-br from-purple-100 to-pink-100 flex items-center justify-center text-7xl">🛍️</div>
          <div class="p-4">
            <h4 class="font-semibold">${p.name}</h4>
            <div class="flex gap-2 mt-2">
              <span class="text-2xl font-bold text-purple-600">${p.price}</span>
              <span class="line-through text-gray-400">${p.old}</span>
            </div>
            <button class="mt-4 w-full bg-purple-600 text-white py-3 rounded-2xl">კალათაში</button>
          </div>
        </div>
      `).join('');
    }

    // Image Preview
    function previewImages(event) {
      const preview = document.getElementById('preview');
      preview.innerHTML = '';
      Array.from(event.target.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = document.createElement('img');
          img.src = e.target.result;
          img.style.width = '110px';
          img.style.height = '110px';
          img.style.objectFit = 'cover';
          img.style.borderRadius = '12px';
          preview.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    }

    function submitProduct() {
      const name = document.getElementById('prodName').value;
      if (!name) return alert("გთხოვთ შეიყვანოთ პროდუქტის სახელი!");
      alert("✅ პროდუქტი წარმატებით დაემატა!");
    }

    // Initialize
    renderProducts();
  </script>
</body>
</html>
