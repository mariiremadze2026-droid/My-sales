<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>საქართველოს მარკეტი - Temu სტილი</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* ანიმაციური გრადიენტის ფონი */
    .animated-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #4facfe 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      z-index: -2;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ნაწილაკების ფონი */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.25;
    }

    .hero-search {
      transition: all 0.4s ease;
    }
    .hero-search:focus-within {
      transform: scale(1.03);
      box-shadow: 0 0 30px rgba(255,255,255,0.5);
    }

    .product-card {
      transition: all 0.3s ease;
    }
    .product-card:hover {
      transform: translateY(-12px);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">

  <!-- ანიმაციური ფონი -->
  <div class="animated-bg"></div>
  <canvas class="particles" id="particles"></canvas>

  <!-- Navbar -->
  <nav class="bg-white/90 backdrop-blur-md sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <h1 class="text-3xl font-bold text-purple-600">🌟 მარკეტი</h1>
      </div>
      
      <div class="flex-1 max-w-2xl mx-8">
        <div class="hero-search bg-white rounded-2xl shadow-lg flex items-center px-5 py-3 border border-purple-200">
          <i class="fas fa-search text-gray-400 mr-3"></i>
          <input type="text" placeholder="რა გინდა იპოვო დღეს?" 
                 class="flex-1 outline-none text-lg bg-transparent">
        </div>
      </div>

      <div class="flex items-center gap-6 text-xl">
        <i class="fas fa-heart cursor-pointer hover:text-red-500 transition"></i>
        <i class="fas fa-shopping-cart cursor-pointer hover:text-purple-600 transition"></i>
        <div class="w-9 h-9 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold">მ</div>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <div class="max-w-7xl mx-auto px-6 pt-12 pb-16 text-center text-white">
    <h2 class="text-5xl font-bold mb-4 drop-shadow-lg">
      დაბალი ფასები • ყველასთვის
    </h2>
    <p class="text-xl mb-10 opacity-90">ალაგებს ათასობით გამყიდველი საქართველოდან</p>
    
    <button onclick="alert('ფლეშ გაყიდვა დაიწყო! 🎉')" 
            class="bg-white text-purple-600 px-10 py-4 rounded-2xl text-xl font-semibold hover:bg-yellow-300 transition-all active:scale-95">
      🔥 დღის ფლეშ გაყიდვები
    </button>
  </div>

  <!-- Categories -->
  <div class="max-w-7xl mx-auto px-6 py-8">
    <h3 class="text-2xl font-bold mb-6 text-white">კატეგორიები</h3>
    <div class="grid grid-cols-3 md:grid-cols-6 gap-4">
      <div class="bg-white/90 backdrop-blur rounded-2xl p-6 text-center hover:scale-105 transition cursor-pointer">
        👕 ტანსაცმელი
      </div>
      <div class="bg-white/90 backdrop-blur rounded-2xl p-6 text-center hover:scale-105 transition cursor-pointer">
        👟 ფეხსაცმელი
      </div>
      <div class="bg-white/90 backdrop-blur rounded-2xl p-6 text-center hover:scale-105 transition cursor-pointer">
        💄 კოსმეტიკა
      </div>
      <div class="bg-white/90 backdrop-blur rounded-2xl p-6 text-center hover:scale-105 transition cursor-pointer">
        📱 გაჯეტები
      </div>
      <div class="bg-white/90 backdrop-blur rounded-2xl p-6 text-center hover:scale-105 transition cursor-pointer">
        🏠 სახლი
      </div>
      <div class="bg-white/90 backdrop-blur rounded-2xl p-6 text-center hover:scale-105 transition cursor-pointer">
        🎁 სხვა
      </div>
    </div>
  </div>

  <!-- Products -->
  <div class="max-w-7xl mx-auto px-6 pb-16">
    <h3 class="text-2xl font-bold mb-8 text-white">🔥 პოპულარული საქონელი</h3>
    
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6" id="products">
      <!-- JS-ით შეივსება -->
    </div>
  </div>

  <script>
    // ნაწილაკების ანიმაცია
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particlesArray = [];

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedX = Math.random() * 0.5 - 0.25;
        this.speedY = Math.random() * 0.5 - 0.25;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
      }
      draw() {
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initParticles() {
      particlesArray = [];
      for (let i = 0; i < 120; i++) {
        particlesArray.push(new Particle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
        particlesArray[i].draw();
      }
      requestAnimationFrame(animateParticles);
    }

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
    });

    // პროდუქტების მაგალითები
    const products = [
      { name: "სპორტული კოსტუმი", price: "89 ლ", oldPrice: "129 ლ" },
      { name: "უსადენო ყურსასმენები", price: "45 ლ", oldPrice: "79 ლ" },
      { name: "ქალის ჩანთა", price: "65 ლ", oldPrice: "95 ლ" },
      { name: "ტელეფონის ქეისი", price: "15 ლ", oldPrice: "25 ლ" },
      { name: "სამზარეულოს ნაკრები", price: "120 ლ", oldPrice: "180 ლ" },
    ];

    function renderProducts() {
      const container = document.getElementById('products');
      container.innerHTML = '';
      
      products.forEach(product => {
        const card = `
          <div class="product-card bg-white rounded-3xl overflow-hidden shadow-lg">
            <div class="h-56 bg-gradient-to-br from-purple-100 to-pink-100 flex items-center justify-center text-6xl">
              🛍️
            </div>
            <div class="p-4">
              <h4 class="font-semibold">${product.name}</h4>
              <div class="flex items-center gap-2 mt-2">
                <span class="text-2xl font-bold text-purple-600">${product.price}</span>
                <span class="line-through text-gray-400">${product.oldPrice}</span>
              </div>
              <button class="mt-4 w-full bg-purple-600 text-white py-3 rounded-2xl hover:bg-purple-700 transition">
                კალათაში
              </button>
            </div>
          </div>
        `;
        container.innerHTML += card;
      });
    }

    // ინიციალიზაცია
    initParticles();
    animateParticles();
    renderProducts();
  </script>
</body>
</html>
