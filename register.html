<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>რეგისტრაცია - მარკეტი</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .animated-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #4facfe 100%); background-size: 400% 400%; animation: gradientShift 15s ease infinite; z-index: -2; }
    @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-50">

  <div class="animated-bg"></div>

  <div class="max-w-md w-full mx-4 bg-white rounded-3xl shadow-2xl p-8 relative z-10">
    <h2 class="text-3xl font-bold text-center mb-2 text-purple-600">გახდი გამყიდველი</h2>
    <p class="text-center text-gray-500 mb-8">დაიწყე გაყიდვა უკვე დღეს</p>

    <form class="space-y-5">
      <input type="text" placeholder="სრული სახელი" class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:border-purple-500 outline-none">
      <input type="email" placeholder="ელ. ფოსტა" class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:border-purple-500 outline-none">
      <input type="tel" placeholder="ტელეფონი (+995)" class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:border-purple-500 outline-none">
      
      <input type="password" placeholder="პაროლი" class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:border-purple-500 outline-none">
      
      <div class="pt-4">
        <button type="button" onclick="alert('რეგისტრაცია წარმატებულია! 🎉')" 
                class="w-full bg-purple-600 hover:bg-purple-700 text-white py-4 rounded-2xl text-lg font-semibold transition">
          რეგისტრაცია
        </button>
      </div>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">უკვე გაქვს ანგარიში? <a href="#" class="text-purple-600">შესვლა</a></p>
  </div>
</body>
</html>
