<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>პროდუქტის დამატება</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .animated-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea, #f093fb); background-size: 400% 400%; animation: gradientShift 15s ease infinite; z-index: -2; }
    @keyframes gradientShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    .image-preview { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .image-preview img { width: 120px; height: 120px; object-fit: cover; border-radius: 12px; }
  </style>
</head>
<body class="bg-gray-50">

  <div class="animated-bg"></div>

  <div class="max-w-3xl mx-auto p-6 pt-12 relative z-10">
    <h2 class="text-3xl font-bold mb-8 text-white">ახალი პროდუქტის დამატება</h2>

    <div class="bg-white rounded-3xl shadow-xl p-8">
      <form>
        <input type="text" placeholder="პროდუქტის სახელი" class="w-full px-5 py-4 rounded-2xl border mb-5">

        <textarea placeholder="აღწერა" rows="4" class="w-full px-5 py-4 rounded-2xl border mb-5"></textarea>

        <div class="grid grid-cols-2 gap-5">
          <input type="number" placeholder="ფასი (ლ)" class="px-5 py-4 rounded-2xl border">
          <input type="number" placeholder="ძველი ფასი (ლ)" class="px-5 py-4 rounded-2xl border">
        </div>

        <!-- ფოტოების ატვირთვა -->
        <div class="mt-8">
          <label class="block text-lg font-medium mb-3 text-gray-700">ფოტოები (შეგიძლია გადაიღო კამერით)</label>
          
          <input type="file" id="productImages" multiple accept="image/*" capture="environment"
                 class="hidden" onchange="previewImages(event)">
          
          <button type="button" onclick="document.getElementById('productImages').click()" 
                  class="border-2 border-dashed border-purple-300 w-full py-12 rounded-3xl hover:border-purple-500 transition text-purple-600">
            📸 დააჭირე ფოტოების გადასაღებად ან ასატვირთად
          </button>

          <div id="imagePreview" class="image-preview"></div>
        </div>

        <button type="button" onclick="alert('პროდუქტი წარმატებით დაემატა! ✅')" 
                class="mt-10 w-full bg-purple-600 text-white py-5 rounded-2xl text-xl font-semibold hover:bg-purple-700">
          პროდუქტის გამოქვეყნება
        </button>
      </form>
    </div>
  </div>

  <script>
    function previewImages(event) {
      const preview = document.getElementById('imagePreview');
      preview.innerHTML = '';
      
      for (let file of event.target.files) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.createElement('img');
          img.src = e.target.result;
          preview.appendChild(img);
        }
        reader.readAsDataURL(file);
      }
    }
  </script>
</body>
</html>
